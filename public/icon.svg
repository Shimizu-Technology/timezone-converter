<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d9488"/>
      <stop offset="50%" style="stop-color:#0891b2"/>
      <stop offset="100%" style="stop-color:#0284c7"/>
    </linearGradient>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bgGradient)"/>
  
  <!-- Wave 1 - Back wave (lighter) -->
  <path fill="rgba(255, 255, 255, 0.15)" d="M0 307 Q 128 230, 256 307 T 512 307 L 512 512 L 0 512 Z"/>
  
  <!-- Wave 2 - Middle wave -->
  <path fill="rgba(255, 255, 255, 0.25)" d="M0 333 Q 128 281, 256 333 T 512 333 L 512 512 L 0 512 Z"/>
  
  <!-- Wave 3 - Front wave (most visible) -->
  <path fill="rgba(255, 255, 255, 0.35)" d="M0 384 Q 128 333, 256 384 T 512 384 L 512 512 L 0 512 Z"/>
  
  <!-- Sun/moon reflection sparkle -->
  <circle cx="384" cy="154" r="41" fill="rgba(255, 255, 255, 0.5)"/>
  <circle cx="333" cy="195" r="15" fill="rgba(255, 255, 255, 0.35)"/>
  
  <!-- Subtle highlight -->
  <ellipse cx="170" cy="140" rx="100" ry="80" fill="rgba(255, 255, 255, 0.1)"/>
</svg>
