<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Favicon and Icons -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0d9488" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hafa Time" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Hafa Timezones" />
    <meta name="msapplication-TileColor" content="#0d9488" />
    
    <title>Hafa Timezones - Convert Time Across Timezones</title>
    <meta name="description" content="Convert time across multiple timezones instantly. Built in Guam with Chamorro spirit. Perfect for coordinating with teams worldwide." />
    <meta name="keywords" content="timezone, converter, world clock, Guam, time zones, meeting scheduler" />
    
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Hafa Timezones" />
    <meta property="og:description" content="Convert time across timezones instantly. Built with love in Guam." />
    <meta property="og:image" content="/pwa-512x512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Hafa Timezones" />
    <meta name="twitter:description" content="Convert time across timezones instantly. Built with love in Guam." />
    
    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Prevent flash of wrong theme -->
    <script>
      (function() {
        // First, always remove dark class
        document.documentElement.classList.remove('dark');
        
        let theme = 'light';
        
        // Check zustand persist storage
        const stored = localStorage.getItem('hafa-theme-v2');
        if (stored) {
          try {
            const parsed = JSON.parse(stored);
            if (parsed.state && parsed.state.theme) {
              theme = parsed.state.theme;
            }
          } catch (e) {}
        }
        
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const isDark = theme === 'dark' || (theme === 'system' && prefersDark);
        
        if (isDark) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
